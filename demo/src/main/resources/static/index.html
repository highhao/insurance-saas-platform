<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>產險架構示範</title>
<style>body{margin:0;background:#f4f7fb;color:#172839;font:16px/1.6 system-ui}main{max-width:780px;margin:3rem auto;padding:0 1rem}section{background:white;border:1px solid #dce4ed;border-radius:12px;padding:1.3rem;margin:1rem 0}button,select{font:inherit;padding:.55rem .85rem}button{background:#285f8e;color:white;border:0;border-radius:6px;cursor:pointer}.muted{color:#526478}.row{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #e4eaf0;padding:.6rem}pre{white-space:pre-wrap}</style></head>
<body><main><h1>產險 API 架構示範</h1><p class="muted">車險與旅平險的模擬查價，使用虛構條件、公司與金額。</p><section><h2>選擇查價情境</h2><div class="row"><label for="scenario">險種</label><select id="scenario"><option value="car">車險：示範車型</option><option value="travel">旅平險：示範旅程</option></select><button id="run">查詢示範方案</button></div><p class="muted">Controller → Service 檢核 → 模擬 Worker → 組合回應</p></section><section><h2>查詢結果</h2><div id="result">尚未查詢。</div></section><small class="muted">展示資料不代表任何真實保險商品、投保資格或保費。</small></main>
<script>
const scenarios={car:"demo-sedan",travel:"demo-trip"};
document.querySelector('#run').addEventListener('click',async()=>{const type=document.querySelector('#scenario').value;const area=document.querySelector('#result');area.textContent='查詢中…';try{const response=await fetch('/demo/quotes/'+type,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reference:scenarios[type]})});if(!response.ok)throw Error('查詢未完成');const result=await response.json();area.replaceChildren();const table=document.createElement('table');const header=document.createElement('tr');['虛構公司','示範方案','示範金額'].forEach(text=>{const th=document.createElement('th');th.textContent=text;header.appendChild(th)});table.appendChild(header);for(const plan of result.data.plans){const tr=document.createElement('tr');[plan.provider,plan.plan,String(plan.estimatedAmount)].forEach(text=>{const td=document.createElement('td');td.textContent=text;tr.appendChild(td)});table.appendChild(tr)}area.appendChild(table)}catch(error){area.textContent=error.message}});
</script></body></html>
