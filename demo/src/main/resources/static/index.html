<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>投保流程示範</title>
<style>body{margin:0;background:#f4f7fb;color:#172839;font:16px/1.6 system-ui}main{max-width:760px;margin:2.5rem auto;padding:0 1rem}section{background:white;border:1px solid #dce4ed;border-radius:12px;padding:1.2rem;margin:1rem 0}button,select{font:inherit;padding:.6rem .8rem;border-radius:6px}button{background:#285f8e;color:white;border:0;cursor:pointer}button.secondary{background:#e7eef5;color:#173950}button:disabled{opacity:.5}label{display:block;margin:.8rem 0 .3rem}.muted{color:#526478}.row{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center}.plan{border:1px solid #dce4ed;border-radius:8px;padding:.9rem;margin:.7rem 0}.result{font-weight:600;color:#205a85}[hidden]{display:none}</style></head>
<body><main><h1>投保流程架構示範</h1><p class="muted">以虛構資料走過查價、選方案、填寫資料、實際報價與投保結果。</p>
<section><h2>1 · 選擇情境</h2><label for="scenario">險種</label><select id="scenario"><option value="car">車險</option><option value="travel">旅平險</option></select><label for="case">示範資料</label><select id="case"></select><div class="plan"><strong id="caseTitle"></strong><p id="caseDetails"></p></div><p class="muted">選擇情境後自動帶入虛構資料，無須填寫真實資料。</p><button id="query">查詢預估方案</button></section>
<section id="plansSection" hidden><h2>2 · 比較並選擇方案</h2><div id="plans"></div></section>
<section id="detailsSection" hidden><h2>3 · 填寫投保資料</h2><p id="selectedPlan" class="result"></p><label for="person">示範投保人</label><select id="person"><option value="mock-person">示範人物（虛構）</option></select><p id="personNote" class="muted"></p><label for="claims">模擬條件</label><select id="claims"><option value="none">情境 A：無示範紀錄</option><option value="history">情境 B：有示範紀錄</option></select><p class="muted">僅切換虛構情境，不輸入真實個資，也不代表真實出險或核保規則。</p><button id="reprice">取得示範實際報價</button></section>
<section id="quoteSection" hidden><h2>4 · 確認報價並模擬投保</h2><p id="quote" class="result"></p><label for="outcome">模擬送件結果</label><select id="outcome"><option value="success">成功</option><option value="failure">失敗</option></select><p><button id="submit">送出示範投保</button></p></section>
<section id="resultSection" hidden aria-live="polite"><h2>5 · 投保結果</h2><p id="result" class="result"></p><div id="resultDetails" class="plan"></div><p class="muted">示範結果，不會建立真實保單。</p><button class="secondary" id="restart">重新開始</button></section>
<p id="message" role="status" class="muted"></p><small class="muted">所有公司、方案、條件與金額均為虛構展示資料。</small></main>
<script>
const $=id=>document.getElementById(id);let state={category:'',plan:''};
const cases={car:[{label:'示範車輛 A',detail:'車籍編號：DEMO-01｜車種：自用小客車｜出廠年：2020',body:{reference:'demo-sedan',vehicleType:'sedan',vehicleYear:2020}},{label:'示範車輛 B',detail:'車籍編號：DEMO-02｜車種：示範休旅車｜出廠年：2022',body:{reference:'demo-sedan',vehicleType:'suv',vehicleYear:2022}}],travel:[{label:'示範旅程 A',detail:'目的地：日本｜出發：2027-05-01｜返回：2027-05-05',body:{reference:'demo-trip',country:'JP',departureDate:'2027-05-01',returnDate:'2027-05-05'}},{label:'示範旅程 B',detail:'目的地：新加坡｜出發：2027-06-10｜返回：2027-06-14',body:{reference:'demo-trip',country:'SG',departureDate:'2027-06-10',returnDate:'2027-06-14'}}]};
function updateCase(){const selected=cases[$('scenario').value][Number($('case').value)];$('caseTitle').textContent=selected.label;$('caseDetails').textContent=selected.detail;hide('plansSection','detailsSection','quoteSection','resultSection');state.plan='';$('message').textContent=''}
function updateCases(){const list=cases[$('scenario').value];$('case').replaceChildren();list.forEach((item,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent=item.label;$('case').appendChild(o)});updateCase()}
async function post(url,data){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw Error('示範請求未完成，請重試');return (await r.json()).data}
function hide(...ids){ids.forEach(id=>$(id).hidden=true)}
$('query').onclick=async()=>{hide('plansSection','detailsSection','quoteSection','resultSection');$('message').textContent='查詢中…';state.category=$('scenario').value;state.plan='';try{const data=await post('/demo/quotes/'+state.category,cases[state.category][Number($('case').value)].body);$('plans').replaceChildren();data.plans.forEach((plan,i)=>{const box=document.createElement('div');box.className='plan';const text=document.createElement('p');text.textContent=`${plan.provider}｜${plan.plan}｜預估示範金額 ${plan.estimatedAmount}`;const btn=document.createElement('button');btn.textContent='選擇方案';btn.onclick=()=>{state.plan=i===0?'A':'B';$('selectedPlan').textContent=`已選擇 ${plan.provider}・${plan.plan}`;$('personNote').textContent=state.category==='car'?'網投示範：要保人與被保險人為同一位示範人物。':'旅平險示範：以同一位虛構旅客填寫資料。';hide('quoteSection','resultSection');$('detailsSection').hidden=false;$('detailsSection').scrollIntoView({behavior:'smooth'});};box.append(text,btn);$('plans').appendChild(box)});$('plansSection').hidden=false;$('message').textContent='';}catch(e){$('message').textContent=e.message}};
function input(){return {category:state.category,plan:state.plan,scenario:$('claims').value,outcome:$('outcome').value}}
$('reprice').onclick=async()=>{hide('resultSection');try{const r=await post('/demo/application/reprice',input());$('quote').textContent=`${r.label}：${r.sampleAmount}`;$('quoteSection').hidden=false;$('message').textContent='';$('quoteSection').scrollIntoView({behavior:'smooth'})}catch(e){$('message').textContent=e.message}};
$('submit').onclick=async()=>{try{const r=await post('/demo/application/submit',input());$('result').textContent=r.message;$('resultDetails').replaceChildren();for(const [label,value] of [['示範單號',r.demoReference],['險種',r.category==='car'?'車險':'旅平險'],['選擇方案','示範公司 '+r.plan+'・方案 '+r.plan],['示範金額',r.sampleAmount],['狀態',r.status]]){const line=document.createElement('p');line.textContent=label+'：'+value;$('resultDetails').appendChild(line)}$('resultSection').hidden=false;$('message').textContent='';$('resultSection').scrollIntoView({behavior:'smooth'})}catch(e){$('message').textContent=e.message}};
$('scenario').onchange=updateCases;$('case').onchange=updateCase;updateCases();
$('claims').onchange=()=>hide('quoteSection','resultSection');$('outcome').onchange=()=>hide('resultSection');$('restart').onclick=()=>{state.plan='';hide('plansSection','detailsSection','quoteSection','resultSection');window.scrollTo({top:0,behavior:'smooth'})};
</script></body></html>
